<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Blooming from Code</title>
    <meta name="description" content="A beautiful blooming 3D Hydrangea cluster created with CSS and JavaScript.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@500;700&family=Fira+Code:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ฉากหลังสวนดอกไม้สดใสยามกลางวัน -->
    <div class="sky-background">
        <!-- แสงดวงอาทิตย์นวลๆ -->
        <div class="sun-glow"></div>
        
        <!-- ก้อนเมฆลอย -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <!-- ภูเขา/เนินเขาฉากหลัง -->
        <svg class="mountains" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="rgba(110, 160, 235, 0.4)" d="M0,192L60,181.3C120,171,240,149,360,165.3C480,181,600,235,720,229.3C840,224,960,160,1080,138.7C1200,117,1320,139,1380,149.3L1440,160L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
        </svg>

        <!-- ทุ่งเนินเขาทุ่งดอกไม้ด้านล่าง -->
        <svg class="flower-field" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="url(#fieldGrad)" d="M0,224L80,213.3C160,203,320,181,480,197.3C640,213,800,267,960,256C1120,245,1280,171,1360,133.3L1440,96L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
            <defs>
                <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#bce7cf" />
                    <stop offset="40%" stop-color="#8fd3ae" />
                    <stop offset="100%" stop-color="#5bb385" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <div class="vignette"></div>
    <div class="ambient-light" id="ambientLight"></div>

    <div class="trigger-overlay" id="triggerOverlay">
        <div class="glass-card">
            <div class="card-glow"></div>
            
            <div class="rose-icon">
                <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M36 62V48" stroke="#388e3c" stroke-width="4" stroke-linecap="round"/>
                    <path d="M36 54C28 52 20 54 18 58C23 61 30 59 36 54Z" fill="#2e7d32"/>
                    <path d="M36 51C44 49 52 51 54 55C49 58 42 56 36 51Z" fill="#1b5e20"/>
                    
                    <circle cx="25" cy="30" r="9" fill="#8ca0ff"/>
                    <circle cx="47" cy="30" r="9" fill="#b28cff"/>
                    <circle cx="28" cy="42" r="8.5" fill="#7db9ff"/>
                    <circle cx="44" cy="42" r="8.5" fill="#f08cff"/>
                    <circle cx="20" cy="38" r="7.5" fill="#b28cff"/>
                    <circle cx="52" cy="38" r="7.5" fill="#8ca0ff"/>
                    <circle cx="36" cy="46" r="8" fill="#5271ff"/>
                    
                    <circle cx="36" cy="22" r="10" fill="#f08cff"/>
                    <circle cx="28" cy="22" r="8.5" fill="#9baeff"/>
                    <circle cx="44" cy="22" r="8.5" fill="#c3a0ff"/>
                    <circle cx="36" cy="32" r="9.5" fill="#8cb2ff"/>

                    <circle cx="25" cy="30" r="1.8" fill="#fff"/>
                    <circle cx="47" cy="30" r="1.8" fill="#fff"/>
                    <circle cx="28" cy="42" r="1.8" fill="#fff"/>
                    <circle cx="44" cy="42" r="1.8" fill="#fff"/>
                    <circle cx="20" cy="38" r="1.5" fill="#fff"/>
                    <circle cx="52" cy="38" r="1.5" fill="#fff"/>
                    <circle cx="36" cy="46" r="1.8" fill="#fff"/>
                    <circle cx="36" cy="22" r="2" fill="#fff"/>
                    <circle cx="28" cy="22" r="1.8" fill="#fff"/>
                    <circle cx="44" cy="22" r="1.8" fill="#fff"/>
                    <circle cx="36" cy="32" r="2" fill="#fff"/>
                </svg>
            </div>

            <h2 class="title">Flower.css</h2>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <p class="status-text" id="statusText">Ready to compile...</p>
            <button class="start-button" id="startButton" disabled>
                <span class="btn-text">Tap to Bloom</span>
                <span class="btn-shine"></span>
            </button>
        </div>
    </div>

    <div class="scene">
        <div class="rose-wrapper" id="roseWrapper">
            <div class="stem-group">
                <div class="stem" id="stem">
                    <div class="stem-highlight"></div>
                </div>
                <div class="leaf leaf-left" id="leafLeft">
                    <div class="leaf-vein"></div>
                </div>
                <div class="leaf leaf-right" id="leafRight">
                    <div class="leaf-vein"></div>
                </div>
            </div>

            <div class="calyx" id="calyx"></div>

            <div class="rose-head" id="roseHead">
                <div class="rose-glow"></div>
                <div class="rose-glow-inner"></div>
            </div>
        </div>
    </div>

    <div class="end-text" id="endText">
        <p class="tagline" id="tagline">For my lovely, Premsiri <3</p>
        
        <div class="end-icon">
            <svg width="40" height="40" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="18" cy="22" r="7" fill="#8ca0ff"/>
                <circle cx="32" cy="22" r="7" fill="#b28cff"/>
                <circle cx="20" cy="32" r="6" fill="#7db9ff"/>
                <circle cx="30" cy="32" r="6" fill="#f08cff"/>
                <circle cx="25" cy="16" r="8" fill="#f08cff"/>
                <circle cx="25" cy="25" r="7.5" fill="#9baeff"/>
                
                <circle cx="18" cy="22" r="1.5" fill="#fff"/>
                <circle cx="32" cy="22" r="1.5" fill="#fff"/>
                <circle cx="20" cy="32" r="1.3" fill="#fff"/>
                <circle cx="30" cy="32" r="1.3" fill="#fff"/>
                <circle cx="25" cy="16" r="1.8" fill="#fff"/>
                <circle cx="25" cy="25" r="1.5" fill="#fff"/>
            </svg>
        </div>
    </div>

    <div id="fallingPetals"></div>

    <script src="script.js"></script>
</body>

</html>
